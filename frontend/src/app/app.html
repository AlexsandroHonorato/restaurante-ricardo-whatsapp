@if (auth.user()) {
  <div class="app-container">
    <app-sidebar id="menu-principal" [hidden]="!menuAberto()"></app-sidebar>
    <div class="main-wrapper">
      <app-header
        [menuAberto]="menuAberto()"
        (alternarMenu)="menuAberto.set(!menuAberto())"
      ></app-header>
      <main class="content-area">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
