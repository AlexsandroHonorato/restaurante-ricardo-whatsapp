name: Produção BotClient

# PR para main: só testes. Push/merge em main (ou execução manual): testes → pacote único por SHA →
# publicação em cada empresa de vars.EMPRESAS. Sem vars.EMPRESAS definida, nada é publicado.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: botclient-${{ github.event_name == 'pull_request' && github.ref || 'producao' }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bot (Node)
        run: npm test
      - name: Painel (Angular)
        working-directory: frontend
        run: |
          npm ci
          npx ng test --watch=false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_mysql, mbstring, dom, zip, curl
          coverage: none
          tools: composer:v2
      - name: API (Laravel)
        working-directory: backend
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan test --compact
      - name: Scripts de deploy
        run: |
          for script in deploy/*.sh deploy/cyberpanel/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy/tests -v

  pacote:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, dom, zip, curl
          coverage: none
          tools: composer:v2
      - name: Laravel sem dependências de desenvolvimento
        working-directory: backend
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          composer check-platform-reqs --no-dev
      - name: Build do painel
        working-directory: frontend
        run: |
          npm ci
          npx ng build
      - name: Pacote da versão
        env:
          SHA: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
        run: python3 .github/scripts/empacotar.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: botclient-${{ github.sha }}
          path: runtime/pacote/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publicar:
    needs: pacote
    if: github.event_name != 'pull_request' && vars.EMPRESAS != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        empresa: ${{ fromJSON(vars.EMPRESAS) }}
    name: Publicar / ${{ matrix.empresa }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: botclient-${{ github.sha }}
          path: runtime/pacote/
      - name: Publicar + health check (volta automática se falhar)
        env:
          EMPRESA: ${{ matrix.empresa }}
          SERVERS_CONFIG: ${{ secrets.SERVERS_CONFIG }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: python3 .github/scripts/publicar-empresa.py
      - name: Resultado
        if: always()
        env:
          EMPRESA: ${{ matrix.empresa }}
          RESULTADO: ${{ job.status }}
        run: printf '| Empresa | Resultado | Commit |\n|---|---|---|\n| %s | %s | %s |\n' "$EMPRESA" "$RESULTADO" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
